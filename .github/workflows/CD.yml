name: Publish Python release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distributions:
    uses: ./.github/workflows/python-dist.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust:
    uses: ./.github/workflows/rust.yml

  pypi-publish:
    name: Publish tested distributions to PyPI
    needs: [distributions, rust]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glassure/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - name: Check every artifact matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_python_dist.py dist --expected-tag "$RELEASE_TAG"
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
