# This workflow installs python, uv, and builds the package
# It then uploads the wheels to the artifacts and later to PyPI
name: CD

on:
  release:
    types: [published]

jobs:
  build_package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so hatch-vcs/uv see tags for dynamic versioning

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Build package (wheel + sdist)
        run: uv build

      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*

  pypi-publish:
    name: Upload release to PyPI
    needs: build_package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glassure/
    permissions:
      id-token: write  # required for OIDC auth to PyPI

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4.1.7
        with:
          name: wheels
          path: dist

      - name: Inspect dist folder
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
