[project]
name = "glassure"
version = "3.0.0rc1"
description = "X-ray total-scattering analysis with a Rust numerical core"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"

authors = [
  { name = "Clemens Prescher", email = "clemens.prescher@gmail.com" },
]

classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.7.1,<3.0.0",
]

[project.optional-dependencies]
legacy = [
  "scipy>=1.11.3",
  "lmfit>=1.2.0,<2.0.0",
  "pandas>=2.1.0,<3.0.0",
  "xraylib>=4.1.5,<5.0.0",
]
dev = [
  "glassure[legacy]",
  "mock>=5.0.1,<6.0.0",
  "pytest>=7.3.1,<8.0.0",
  "pytest-cov>=4.1.0,<5.0.0",
]

docs = [
  "glassure[legacy]",
  "sphinx>=7.2.5,<8.0.0",
  "myst-parser>=2.0.0,<3.0.0",
  "nbsphinx>=0.9.3,<1.0.0",
  "jupyter>=1.0.0,<2.0.0",
  "matplotlib>=3.7.2,<4.0.0",
  "sphinx-rtd-theme>=1.3.0,<2.0.0",
  "autodoc-pydantic>=2.2.0,<3.0.0",
]

[tool.maturin]
manifest-path = "rust/glassure-python/Cargo.toml"
locked = true
python-source = "."
module-name = "glassure._glassure_numpy"
# Maturin also includes the workspace/path dependencies and their data in the sdist.
include = [
  { path = "LICENSE", format = ["sdist", "wheel"] },
  { path = "THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
  { path = "tests/**/*", format = "sdist" },
  { path = "scripts/check_python_dist.py", format = "sdist" },
  { path = "docs/*.md", format = "sdist" },
]
exclude = ["glassure/_version.py", "**/__pycache__/**/*", "**/*.pyc"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"
