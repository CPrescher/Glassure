[package]
name = "glassure-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.93"
authors = ["Clemens Prescher"]
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/CPrescher/Glassure"
homepage = "https://github.com/CPrescher/Glassure"
documentation = "https://docs.rs/glassure-core"
description = "Standalone Glassure total-scattering numerical engine"
readme = "README.md"
keywords = ["scattering", "diffraction", "pdf", "materials", "wasm"]
categories = ["science"]
include = ["Cargo.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "src/**", "data/**", "docs/**", "examples/**", "tests/**"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
profiling = []

[[example]]
name = "profile_density"
required-features = ["profiling"]

[dependencies]
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
levenberg-marquardt = { version = "0.15", features = ["minpack-compat"] }
splinefit = "0.4.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

