[package]
name = "glassure-prototype"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
glassure-core = { path = "../../rust/glassure-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
